<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표 - 버스 시간표</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <a href="/" class="back-link">&larr; 노선 목록</a>
    <h1>시간표</h1>
</header>

<main>
    <!-- 요일 탭 -->
    <section class="day-tabs">
        <a th:href="@{/schedule/{id}(id=${routeId}, dayType='WEEKDAY')}"
           th:classappend="${selectedDayType.name() == 'WEEKDAY'} ? ' active'"
           class="tab">평일</a>
        <a th:href="@{/schedule/{id}(id=${routeId}, dayType='SATURDAY')}"
           th:classappend="${selectedDayType.name() == 'SATURDAY'} ? ' active'"
           class="tab">토요일</a>
        <a th:href="@{/schedule/{id}(id=${routeId}, dayType='HOLIDAY')}"
           th:classappend="${selectedDayType.name() == 'HOLIDAY'} ? ' active'"
           class="tab">일요일·공휴일</a>
    </section>

    <!-- 시간표 테이블 -->
    <section class="schedule-section">

        <!-- 데이터가 없을 때 안내 메시지 -->
        <div th:if="${#lists.isEmpty(schedules)}" class="empty-message">
            <p>등록된 시간표가 없습니다.</p>
            <p><small>TODO: 시간표 데이터를 추가하세요.</small></p>
        </div>

        <!-- 시간표 테이블 -->
        <table th:unless="${#lists.isEmpty(schedules)}" class="schedule-table">
            <thead>
                <tr>
                    <th>출발 정류장</th>
                    <th>출발 시각</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="schedule : ${schedules}">
                    <td th:text="${schedule.departureStop}">정류장명</td>
                    <td th:text="${#temporals.format(schedule.departureTime, 'HH:mm')}">00:00</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

<footer>
    <p>버스 시간표 서비스</p>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
