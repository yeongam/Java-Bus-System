<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버스 시간표</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>버스 시간표</h1>
    <p>운행 노선을 선택하세요.</p>
</header>

<main>
    <!-- 노선 검색 (TODO: 검색 기능 구현) -->
    <section class="search-section">
        <input type="text" id="searchInput" placeholder="노선 번호 또는 정류장 검색...">
        <button onclick="search()">검색</button>
    </section>

    <!-- 노선 목록 -->
    <section class="route-list">
        <h2>전체 노선</h2>

        <!-- 데이터가 없을 때 안내 메시지 -->
        <div th:if="${#lists.isEmpty(routes)}" class="empty-message">
            <p>등록된 노선이 없습니다.</p>
            <p><small>TODO: 노선 데이터를 추가하세요.</small></p>
        </div>

        <!-- 노선 카드 목록 -->
        <div class="route-grid">
            <a th:each="route : ${routes}"
               th:href="@{/schedule/{id}(id=${route.id})}"
               class="route-card">
                <span class="route-number" th:text="${route.routeNumber}">000</span>
                <span class="route-info">
                    <span th:text="${route.startStop}">기점</span>
                    &rarr;
                    <span th:text="${route.endStop}">종점</span>
                </span>
            </a>
        </div>
    </section>
</main>

<footer>
    <p>버스 시간표 서비스</p>
</footer>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
