<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - 버스 시간표</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="admin-header">
    <div class="admin-header-inner">
        <div>
            <span class="admin-badge">관리자</span>
            <h1>버스 시간표 관리</h1>
        </div>
        <a th:href="@{/}" class="btn btn-outline" target="_blank">사용자 화면 보기 ↗</a>
    </div>
</header>

<main class="admin-main">

    <!-- 플래시 메시지 -->
    <div th:if="${message}" class="flash-message" th:text="${message}"></div>

    <!-- 상단 액션 -->
    <div class="section-header">
        <h2>노선 목록 <span class="badge" th:text="${#lists.size(routes)}">0</span></h2>
        <a th:href="@{/admin/routes/new}" class="btn btn-primary">+ 노선 추가</a>
    </div>

    <!-- 노선이 없을 때 -->
    <div th:if="${#lists.isEmpty(routes)}" class="empty-card">
        <p>등록된 노선이 없습니다.</p>
        <a th:href="@{/admin/routes/new}" class="btn btn-primary" style="margin-top:12px">첫 노선 추가하기</a>
    </div>

    <!-- 노선 테이블 -->
    <table th:unless="${#lists.isEmpty(routes)}" class="admin-table">
        <thead>
            <tr>
                <th>노선번호</th>
                <th>기점</th>
                <th>종점</th>
                <th>설명</th>
                <th>시간표</th>
                <th>작업</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="route : ${routes}">
                <td><strong th:text="${route.routeNumber}" class="route-num-cell">000</strong></td>
                <td th:text="${route.startStop}">기점</td>
                <td th:text="${route.endStop}">종점</td>
                <td th:text="${route.description}" class="desc-cell">설명</td>
                <td>
                    <a th:href="@{/admin/routes/{id}/schedules(id=${route.id})}"
                       class="btn btn-sm btn-outline">시간표 관리</a>
                </td>
                <td class="action-cell">
                    <a th:href="@{/admin/routes/{id}/edit(id=${route.id})}"
                       class="btn btn-sm btn-secondary">수정</a>
                    <form th:action="@{/admin/routes/{id}/delete(id=${route.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('노선과 모든 시간표가 삭제됩니다. 계속할까요?')">
                        <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
